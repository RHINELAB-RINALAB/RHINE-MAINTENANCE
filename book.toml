[book]
authors = ["Amane Fujimiya"]
language = "en"
src = "src"
title = "RHINELAB Maintenance Wiki"

# ==============================================================================
# NATIVE 0.5.x HTML RENDERER FEATURES (Replaces Admonish & TOC Plugins)
# ==============================================================================

[output.html]
admonitions = true          # Replaces mdbook-admonish using GFM (> [!NOTE])
sidebar-header-nav = true   # Native in-file header tree in the sidebar
definition-lists = true     # Native terms and definitions support
smart-punctuation = true
mathjax-support = false     # Turned off to avoid collision with KaTeX
additional-css = ["css/custom_1.css"]
# ==============================================================================
# SAFE & STABLE PREPROCESSORS
# ==============================================================================

# Math LaTeX pre-rendering
[preprocessor.katex]
after = ["links"]
pre-render = true
optional = true

# Inline shell/command execution
#[preprocessor.cmdrun]
#renderers = ["html"]
#optional = true

# Automatic image dimension calculation
#[preprocessor.image-size]
#optional = true

# Academic reference & citation support
#[preprocessor.bib]
#bibliography = "references.bib"
#render-bib = "cited"
#title = "References"
#optional = true

